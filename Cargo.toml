[package]
name = "web-shooter"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, low-token web reader and focused crawler for AI assistants, served over MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/heyyviv/web-shooter"
homepage = "https://github.com/heyyviv/web-shooter"
readme = "README.md"
keywords = ["mcp", "crawler", "scraper", "llm", "search"]
categories = ["command-line-utilities", "web-programming", "text-processing"]
exclude = ["/eval/snapshots", "/CLAUDE.md", "/.github"]

[dependencies]
anyhow = "1.0.104"
fastembed = { version = "7.1.1", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures = "0.3.34"
lol_html = "2"
pdf_oxide = { version = "0.3.78", default-features = false, features = ["legacy-crypto"] }
model2vec-rs = { version = "0.3.0", default-features = false, features = ["hf-hub", "fancy-regex"] }
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spider = { version = "2.53.9", default-features = false, features = ["encoding", "reqwest_rustls_tls", "sync"] }
spider_transformations = "2.39.13"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std"] }

[features]
# The cross-encoder behind `fetch`'s `precise` option. Off by default: it adds
# ONNX Runtime to the binary and didn't rank better than embeddings in the eval.
rerank = ["dep:fastembed"]

[profile.release]
strip = true

# The profile that 'dist' will build with. LTO and one codegen unit save
# another ~2 MB but make a rebuild take minutes, so local builds skip them.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
