[package]
name = "web-shooter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
fastembed = { version = "7.1.1", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
futures = "0.3.34"
lol_html = "2"
model2vec-rs = { version = "0.3.0", default-features = false, features = ["hf-hub", "fancy-regex"] }
regex = "1.13.1"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
rust-stemmers = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spider = { version = "2.53.9", default-features = false, features = ["encoding", "reqwest_rustls_tls", "sync"] }
spider_transformations = "2.39.13"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std"] }
